# ============================================================
# mwcast.mediusware.xyz — Host Nginx Config
# SSL is managed by Certbot (Let's Encrypt)
# Traffic is forwarded to the internal Caddy container on :8090
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mwcast.mediusware.xyz;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mwcast.mediusware.xyz;

    # --- SSL Certificates (filled in by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/mwcast.mediusware.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwcast.mediusware.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # --- Increase buffer for media / large uploads ---
    client_max_body_size 500M;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # --- Forward everything to internal Caddy gateway ---
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Required for WebSocket support (HLS / WebRTC signalling)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
